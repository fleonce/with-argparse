[project]
name = "with-argparse"
description = "A simple but handy Python library to parse a type-annotated method as a CLI interface with support for dataclasses and attrs instances"
version = "1.0.6rc1"
license = {text = "Apache 2.0"}
readme = "README.md"

dependencies = [
    "attrs>=26.1.0",
    "typing-extensions>=4.15.0",
]
requires-python = ">= 3.12"

authors = [
    { name = "Moritz Hennen", email = "mail@fleance.de" }
]

keywords = [ "argparse", "type annotation", "auto" ]
classifiers = [
    "Development Status :: 3 - Alpha",

    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Intended Audience :: System Administrators",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Utilities",

    "License :: OSI Approved :: Apache Software License",

    "Natural Language :: English",
    "Programming Language :: Python :: 3 :: Only",
]

[project.urls]
repository = "https://github.com/fleonce/with-argparse/"

[tool.setuptools]
packages = ["with_argparse"]

[tool.uv]
package = true

[dependency-groups]
dev = [
    "mypy>=2.3.0",
]
